# XcodeGen spec for the Apple TV app (TVOS.md). Generate with `xcodegen` (scripts/build-tvos.sh does it).
# The engine is the Rust static library `libopen_unleashed.a`, built by cargo before Xcode runs.
name: OpenUnleashed
options:
  bundleIdPrefix: com.dannyelson
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    # stand-in until <com.yourname.openunleashed> is known (PROGRESS.md)
    PRODUCT_BUNDLE_IDENTIFIER: ${NFSH_BUNDLE_ID}
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${NFSH_TEAM_ID}
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
targets:
  OpenUnleashed:
    type: application
    platform: tvOS
    sources:
      - path: OpenUnleashed
      # The Need for Speed SE: ReNFS's own files, unchanged (main renamed renfs_main), against the host's SDL 2
      # stand-in (platform/renfs-host/include) — no SDL 2 in the app
      - path: ../../engines/renfs/port/src
        includes: ["*.c", "*.h"]
        compilerFlags: ["-Dmain=renfs_main", "-fwrapv", "-w"]
        buildPhase: sources
      - path: ../renfs-host
        excludes: ["test/**"]
    settings:
      base:
        INFOPLIST_FILE: OpenUnleashed/Info.plist
        # layered app icon + Top Shelf from the project's own mark (platform/tvos/make_brand_assets.py)
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_OBJC_BRIDGING_HEADER: OpenUnleashed/OpenUnleashed-Bridging-Header.h
        # ReNFS: <SDL.h> and "renfs_version.h" are the host's (platform/renfs-host/include), never a real SDL's
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../renfs-host/include", "$(SRCROOT)/../renfs-host"]
        GCC_C_LANGUAGE_STANDARD: gnu11
        TARGETED_DEVICE_FAMILY: "3"
        "LIBRARY_SEARCH_PATHS[sdk=appletvsimulator*]": $(SRCROOT)/../../target/tvos/aarch64-apple-tvos-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=appletvos*]": $(SRCROOT)/../../target/tvos/aarch64-apple-tvos/release
        ARCHS: arm64
        OTHER_LDFLAGS:
          - -lopen_unleashed
          - -lc++
          - -framework Metal
          - -framework QuartzCore
          - -framework UIKit
          - -framework Foundation
          - -framework CoreFoundation
          - -framework CoreGraphics
          - -framework CoreVideo
          - -framework AVFoundation
          - -framework AudioToolbox
          - -framework CoreAudio
          - -framework GameController
          - -framework CoreHaptics
          - -framework Security
          - -framework SystemConfiguration
          - -framework OpenGLES
          - -framework CoreBluetooth
