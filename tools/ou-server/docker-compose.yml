# ou-server with Docker Compose (docs/ou-server.md). On Unraid use the template packaging/unraid/ou-server.xml.
services:
  ou-server:
    image: ghcr.io/dannyelson82/ou-server:latest
    container_name: ou-server
    restart: unless-stopped
    ports:
      - "8642:8642"
    environment:
      OU_TOKEN: "change-me"          # shared secret the game sends
      OU_NAME: "OpenUnleashed server"
      OU_SAVE_VERSIONS: "20"
      OU_LOBBY_TTL: "15"
      PUID: "99"
      PGID: "100"
      TZ: "Etc/UTC"
    volumes:
      - /mnt/user/appdata/ou-server/game:/game:ro   # the original GameData/, FEData/, version.txt, fe.txt
      - /mnt/user/appdata/ou-server/mods:/mods:ro   # one folder per mod set
      - /mnt/user/appdata/ou-server/hd:/hd:ro       # optional HD texture pack
      - /mnt/user/appdata/ou-server/data:/data      # saves, versions, caches
