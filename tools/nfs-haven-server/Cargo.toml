[package]
name = "nfs-haven-server"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "NFS Haven server: game data for every game, saves and the multiplayer lobby for the NFS Haven app (Apple TV, Mac)"

[dependencies]
nfs-haven-manifest = { path = "../../crates/nfs-haven-manifest" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
