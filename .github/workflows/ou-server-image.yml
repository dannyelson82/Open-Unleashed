name: ou-server image

# Builds, smoke-tests, scans and publishes ghcr.io/dannyelson82/ou-server (docs/ou-server.md),
# the same way as the Haven apps. Tags: `latest` + `edge` from the working branches, `X.Y.Z` from
# `ou-server-vX.Y.Z` tags, and the short commit SHA.

on:
  push:
    branches: [main, tvos-port]
    tags: ["ou-server-v*.*.*"]
    paths:
      - "tools/ou-server/**"
      - "crates/ou-manifest/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/ou-server-image.yml"
  pull_request:
    paths:
      - "tools/ou-server/**"
      - "crates/ou-manifest/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ou-server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dannyelson82/ou-server

jobs:
  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/ou-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ou-server:ci
          cache-from: type=gha,scope=ou-server
          cache-to: type=gha,mode=max,scope=ou-server

      - name: Smoke test
        run: |
          set -eu
          # a stand-in game folder (never real game files in CI)
          mkdir -p /tmp/ou/game/GameData/Track /tmp/ou/game/FEData /tmp/ou/mods/test/GameData/Track /tmp/ou/data
          printf 'track' > /tmp/ou/game/GameData/Track/a.bin
          printf 'fe' > /tmp/ou/game/FEData/b.bin
          printf '3.2' > /tmp/ou/game/version.txt
          printf 'modded' > /tmp/ou/mods/test/GameData/Track/a.bin
          chmod -R a+rwX /tmp/ou
          docker run -d --name ou -p 8642:8642 -e OU_TOKEN=ci-token \
            -v /tmp/ou/game:/game:ro -v /tmp/ou/mods:/mods:ro -v /tmp/ou/data:/data ou-server:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ou)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker ps -a
          test "$(docker inspect -f '{{.State.Health.Status}}' ou)" = healthy
          curl -fsS http://127.0.0.1:8642/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8642/v1/info)" = 401
          H='Authorization: Bearer ci-token'
          curl -fsS -H "$H" http://127.0.0.1:8642/v1/info | grep -q '"lobby":true'
          for _ in $(seq 1 15); do curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/sets | grep -q 'mod-test' && break; sleep 1; done
          curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/original/manifest | grep -q 'GameData/Track/a.bin'
          test "$(curl -fsS -H "$H" -r 2- http://127.0.0.1:8642/v1/data/original/file/GameData/Track/a.bin)" = ack
          test "$(curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/mod-test/file/GameData/Track/a.bin)" = modded
          printf 'save' | curl -fsS -H "$H" -X PUT --data-binary @- http://127.0.0.1:8642/v1/saves/ci/files/SaveData/0.sav
          test "$(printf 'x' | curl -s -o /dev/null -w '%{http_code}' -H "$H" -X PUT --data-binary @- http://127.0.0.1:8642/v1/saves/ci/files/SaveData/0.sav)" = 412
          curl -fsS "http://127.0.0.1:8642/?token=ci-token" | grep -q '<h2>Saves</h2>'
          # runs as PUID 99, not root; saves land in /data owned by it
          docker top ou -eo pid,uid,args
          test "$(docker top ou -eo pid,uid,args | awk '/bin\/ou-server/ {print $2; exit}')" = 99
          test "$(stat -c %u /tmp/ou/data/saves/ci/current/SaveData/0.sav)" = 99
          docker logs ou 2>&1 | tail -n 20
          docker rm -f ou

      - name: Vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ou-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ou-server:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/tvos-port' || github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=match,pattern=ou-server-v(\d+\.\d+\.\d+),group=1
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/ou-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=ou-server
            org.opencontainers.image.licenses=GPL-3.0-or-later
          cache-from: type=gha,scope=ou-server
