name: nfs-haven-server image

# Builds, smoke-tests, scans and publishes ghcr.io/dannyelson82/nfs-haven-server (docs/nfs-haven-server.md),
# the same way as the Haven apps. Tags: `latest` + `edge` from the working branches, `X.Y.Z` from
# `nfs-haven-server-vX.Y.Z` tags, and the short commit SHA.

on:
  push:
    branches: [main, tvos-port]
    tags: ["nfs-haven-server-v*.*.*"]
    paths:
      - "tools/nfs-haven-server/**"
      - "crates/nfs-haven-manifest/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/nfs-haven-server-image.yml"
  pull_request:
    paths:
      - "tools/nfs-haven-server/**"
      - "crates/nfs-haven-manifest/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfs-haven-server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dannyelson82/nfs-haven-server

jobs:
  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/nfs-haven-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nfs-haven-server:ci
          cache-from: type=gha,scope=nfs-haven-server
          cache-to: type=gha,mode=max,scope=nfs-haven-server

      - name: Smoke test
        run: |
          set -eu
          # a stand-in games folder (never real game files in CI)
          G=/tmp/nfsh/games/porsche
          mkdir -p $G/original/GameData/Track $G/original/FEData $G/mods/test/GameData/Track /tmp/nfsh/games/nfsse/original /tmp/nfsh/data /tmp/nfsh/inbox /tmp/nfsh/sources /tmp/nfsh/staging
          printf 'track' > $G/original/GameData/Track/a.bin
          printf 'fe' > $G/original/FEData/b.bin
          printf '3.5' > $G/original/version.txt
          printf 'modded' > $G/mods/test/GameData/Track/a.bin
          printf 'exe' > /tmp/nfsh/games/nfsse/original/NFS_DOS.EXE
          chmod -R a+rwX /tmp/nfsh
          docker run -d --name nfsh -p 8642:8642 -e NFSH_TOKEN=ci-token \
            -v /tmp/nfsh/games:/games -v /tmp/nfsh/data:/data -v /tmp/nfsh/inbox:/inbox \
            -v /tmp/nfsh/sources:/sources -v /tmp/nfsh/staging:/staging nfs-haven-server:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' nfsh)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker ps -a
          test "$(docker inspect -f '{{.State.Health.Status}}' nfsh)" = healthy
          curl -fsS http://127.0.0.1:8642/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8642/v1/info)" = 401
          H='Authorization: Bearer ci-token'
          curl -fsS -H "$H" http://127.0.0.1:8642/v1/info | grep -q '"server":"nfs-haven-server"'
          for _ in $(seq 1 15); do curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/sets | grep -q 'porsche/mod-test' && break; sleep 1; done
          curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/porsche/original/manifest | grep -q 'GameData/Track/a.bin'
          test "$(curl -fsS -H "$H" -r 2- http://127.0.0.1:8642/v1/data/porsche/original/file/GameData/Track/a.bin)" = ack
          test "$(curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/porsche/mod-test/file/GameData/Track/a.bin)" = modded
          test "$(curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/nfsse/original/file/NFS_DOS.EXE)" = exe
          # the fast-install bundle: a real tar of the set, and a range of it
          curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/porsche/original.tar | tar -tf - | grep -q 'GameData/Track/a.bin'
          test "$(curl -fsS -H "$H" -r 512-513 http://127.0.0.1:8642/v1/data/porsche/original.tar)" = fe
          printf 'save' | curl -fsS -H "$H" -X PUT --data-binary @- http://127.0.0.1:8642/v1/saves/porsche/files/SaveData/0.sav
          test "$(printf 'x' | curl -s -o /dev/null -w '%{http_code}' -H "$H" -X PUT --data-binary @- http://127.0.0.1:8642/v1/saves/porsche/files/SaveData/0.sav)" = 412
          curl -fsS "http://127.0.0.1:8642/?token=ci-token" | grep -q 'NFS Haven server'
          # an import: a made-up Porsche disc (Joliet ISO) dropped into the inbox becomes porsche/original
          sudo apt-get install -y -qq genisoimage > /dev/null
          D=/tmp/fakedisc; mkdir -p $D/GameData/Track $D/FEData
          printf 'imported' > $D/GameData/Track/c.bin; printf 'fe2' > $D/FEData/d.bin; printf '3.2' > $D/version.txt; printf 'x' > $D/Porsche.exe
          genisoimage -quiet -J -V "NFS V" -o /tmp/nfsh/inbox/porsche.iso $D
          chmod a+rw /tmp/nfsh/inbox/porsche.iso
          for _ in $(seq 1 30); do curl -fsS -H "$H" http://127.0.0.1:8642/v1/imports | grep -q '"state":"done"' && break; sleep 2; done
          curl -fsS -H "$H" http://127.0.0.1:8642/v1/imports
          curl -fsS -H "$H" http://127.0.0.1:8642/v1/imports | grep -q '"state":"done"'
          for _ in $(seq 1 15); do curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/porsche/original/manifest | grep -q 'GameData/Track/c.bin' && break; sleep 1; done
          test "$(curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/porsche/original/file/GameData/Track/c.bin)" = imported
          if curl -fsS -H "$H" http://127.0.0.1:8642/v1/data/porsche/original/manifest | grep -q 'Porsche.exe'; then echo "Porsche.exe must not be in the set"; exit 1; fi
          test ! -e /tmp/nfsh/inbox/porsche.iso && test -e /tmp/nfsh/sources/porsche/porsche.iso
          curl -fsS "http://127.0.0.1:8642/?token=ci-token" | grep -q '<h2>Imports</h2>'
          # runs as PUID 99, not root; saves land in /data owned by it
          docker top nfsh -eo pid,uid,args
          test "$(docker top nfsh -eo pid,uid,args | awk '$3 == "nfs-haven-server" {print $2; exit}')" = 99
          test "$(stat -c %u /tmp/nfsh/data/saves/porsche/current/SaveData/0.sav)" = 99
          docker logs nfsh 2>&1 | tail -n 20
          docker rm -f nfsh

      - name: Vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nfs-haven-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nfs-haven-server:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/tvos-port' || github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=match,pattern=nfs-haven-server-v(\d+\.\d+\.\d+),group=1
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/nfs-haven-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=nfs-haven-server
            org.opencontainers.image.licenses=GPL-3.0-or-later
          cache-from: type=gha,scope=nfs-haven-server
