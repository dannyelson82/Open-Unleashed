[package]
name = "open-unleashed"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "open_unleashed"
path = "src/lib.rs"

[[bin]]
name = "open-unleashed"
path = "src/main.rs"

[dependencies]
nfs-assets.workspace = true
nfs-formats.workspace = true
nfs-renderer.workspace = true
nfs-game.workspace = true
nfs-net.workspace = true
nfs-input.workspace = true
nfs-physics.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
glam.workspace = true
nfs-math.workspace = true
image.workspace = true
nfs-audio.workspace = true
# the OpenUnleashed server client (save sync, lobby): blocking HTTP on a worker thread; rustls for `*.ts.net` HTTPS
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"

# Mac head-look (AirPods motion, `airpods-plan.md` H): CoreMotion's headphone motion manager, macOS only
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-motion = { version = "0.3", default-features = false, features = ["std", "CMHeadphoneMotionManager", "CMDeviceMotion", "CMAttitude", "CMLogItem", "CMAuthorization"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSString"] }
objc2 = "0.6"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde_json = "1"
